<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassicOS</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/x-icon" href="/assets/window.gif">
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#menuImage").click(function (e) {
                e.preventDefault();
                $("#windowMenu").toggle();
            });
        });
        function openCloak() {
            let win = window.open();
            let url = "https://classic-os.pages.dev";

            let $iframe = $("<iframe>", {
                src: url,
                css: {
                    width: "100%",
                    height: "100%",
                    border: "none"
                }
            });

            $(win.document.body).append($iframe);
        }
        function openChat() {
            $("#1").remove();

            let $iframe = $("<iframe>", {
                src: "/chat", 
                id: "1",
                css: {
                    width: "70%",
                    height: "50%",
                    border: "black soild 10px",
                    margin: "auto",
                    display: "block"
                }
            });

            $("body").append($iframe);
        }
        function openGames() {
            $("#1").remove();

            let $iframe = $("<iframe>", {
                src: "/games", 
                id: "1",
                css: {
                    width: "70%",
                    height: "50%",
                    border: "black soild 10px",
                    margin: "auto",
                    display: "block"
                }
            });

            $("body").append($iframe);
        }
    </script>
</head>

<body>
    <div class="os">
        <div id="windowMenu">
            <button onclick="openGames();">Games</button><br />
            <button onclick="openChat();">Chat</button><br />
            <button onclick="openCloak();">Cloaker</button><br />
        </div>
    </div>
    <div class="taskbar">
        <img src="/assets/person.png" id="menuImage" />
    </div>
</body>

</html>
