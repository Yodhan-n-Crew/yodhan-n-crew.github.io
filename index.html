<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassOS</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/x-icon" href="/assets/window.gif">
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <script>
         $(document).ready(function(){
            $("#menuClick").dblclick(function(e){
                e.preventDefault();
                $("#windowMenu").toggle();
            });
        });
    </script>
</head>

<body>
    <div class="os">
        <div id="windowMenu">
            <a href="/games">Games</a><br />
            <a href="/chat">Chat</a><br />
        </div>
    </div>
    <div class="taskbar">
        <a href="#" id="menuClick"><img src="/assets/person.png" id="menuImage" /></a>
    </div>
</body>

</html>
